<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparky Control</title>
<style>
  :root {
    --bg: #0b0e13;
    --bg-soft: #11151d;
    --card: #171c26;
    --card-hover: #1d2330;
    --line: #262e3d;
    --line-soft: #1e2532;
    --text: #e8edf4;
    --dim: #8b98a9;
    --accent: #4da3ff;
    --accent-soft: rgba(77, 163, 255, 0.14);
    --ok: #3ecf8e;
    --bad: #ff5c5c;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(77,163,255,.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }
  ::-webkit-scrollbar-thumb:hover { background: #33405a; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(13, 17, 24, 0.82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 10;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 650; letter-spacing: .01em; margin-right: 4px; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 99px;
    background: var(--card); border: 1px solid var(--line); color: var(--dim);
    transition: color .15s, border-color .15s;
    white-space: nowrap;
  }
  .chip.ok  { color: var(--ok);  border-color: rgba(62,207,142,.45); }
  .chip.bad { color: var(--bad); border-color: rgba(255,92,92,.45); }
  #headerRight { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  button {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 14px; font-size: 14px;
    font-family: inherit; cursor: pointer;
    transition: background .15s, border-color .15s, transform .05s;
  }
  button:hover { border-color: var(--accent); background: var(--card-hover); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08111c; font-weight: 620; }
  button.primary:hover { filter: brightness(1.08); }
  #estopBtn { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 750; }
  #estopBtn:hover { filter: brightness(1.1); border-color: var(--bad); }
  #muteBtn.muted { background: var(--bad); border-color: var(--bad); color: #fff; }

  #volWrap { display: none; align-items: center; gap: 8px; }
  #volWrap.show { display: flex; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 130px; height: 4px; border-radius: 4px;
    background: var(--line); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
    transition: transform .1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  #volLabel { min-width: 42px; text-align: right; }

  #muteBanner {
    display: none; background: var(--bad); color: #fff; font-weight: 700;
    padding: 10px 16px; text-align: center; cursor: pointer;
  }

  main { display: flex; flex: 1; min-height: 0; }
  #left { flex: 2; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line-soft); }
  #transcript { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg {
    max-width: 78%; padding: 9px 13px; border-radius: 14px;
    white-space: pre-wrap; word-wrap: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
    animation: msgIn .18s ease-out;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: #1c3a5f; border-bottom-right-radius: 5px; }
  .msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line-soft); border-bottom-left-radius: 5px; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; font-weight: 600; letter-spacing: .03em; }

  #inputs { padding: 12px 18px; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 8px; background: var(--bg-soft); }
  .row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: var(--radius-sm); padding: 9px 13px; font-size: 15px; font-family: inherit;
    transition: border-color .15s;
  }
  input[type=text]::placeholder { color: #5d6b7e; }
  input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  #right { flex: 1; min-width: 300px; max-width: 400px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  details.sec {
    background: var(--card); border: 1px solid var(--line-soft);
    border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden;
  }
  details.sec > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--dim);
    transition: color .15s, background .15s;
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary:hover { color: var(--text); background: var(--card-hover); }
  details.sec > summary::before {
    content: ""; width: 7px; height: 7px; flex: none;
    border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim);
    transform: rotate(-45deg); transition: transform .18s ease;
    margin-right: 2px;
  }
  details.sec[open] > summary::before { transform: rotate(45deg); }
  .secBody { padding: 4px 14px 14px; }

  #camFeed {
    width: 100%; border-radius: var(--radius-sm); display: block;
    background: #000; aspect-ratio: 4/3; object-fit: contain;
    border: 1px solid var(--line-soft);
  }
  select {
    width: 100%; background: var(--bg-soft); border: 1px solid var(--line); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 14px; font-family: inherit;
    margin-top: 10px; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  /* 117 clips: filter box + per-category groups, each scroll-capped so
     the right column stays usable */
  #animFilter { width: 100%; margin-bottom: 8px; background: var(--bg-soft);
                border: 1px solid var(--line); color: var(--text);
                border-radius: var(--radius-sm); padding: 7px 11px;
                font-size: 13.5px; font-family: inherit; }
  #animFilter:focus { outline: none; border-color: var(--accent); }
  details.animCat { margin-bottom: 6px; border: 1px solid var(--line-soft);
                    border-radius: var(--radius-sm); background: var(--bg-soft); }
  details.animCat > summary { list-style: none; cursor: pointer; user-select: none;
                              padding: 7px 11px; font-size: 11.5px; font-weight: 700;
                              text-transform: uppercase; letter-spacing: .08em;
                              color: var(--dim); }
  details.animCat > summary::-webkit-details-marker { display: none; }
  details.animCat > summary::before { content: "▸ "; }
  details.animCat[open] > summary::before { content: "▾ "; }
  details.animCat > summary:hover { color: var(--text); }
  /* cap expanded groups; the header count (e.g. "Emotions (78)") makes it
     clear there's more than the visible rows, unlike the old hidden caps */
  .animGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
              gap: 6px; padding: 0 8px 8px; max-height: 320px; overflow-y: auto;
              overscroll-behavior: contain; }
  /* min-width:0 + wrapping: Firefox won't shrink grid items below their
     content, so long names overflowed the clipped card */
  .animGrid button { font-size: 12.5px; padding: 7px 4px; background: var(--bg-soft);
                     min-width: 0; white-space: normal; word-break: break-word; }
  .secBody { min-width: 0; }
  #dpad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 42px); gap: 6px; justify-content: center; }
  #dpad button { padding: 0; background: var(--bg-soft); font-size: 15px; }
  #dpad .blank { visibility: hidden; }

  #speakerList { display: flex; flex-direction: column; gap: 6px; }
  .spkRow {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--bg-soft); border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm); padding: 7px 11px; font-size: 13.5px;
  }
  .spkRow .name { font-weight: 600; }
  .spkRow button { font-size: 12px; padding: 4px 10px; }
  .spkEmpty { color: var(--dim); font-size: 13px; padding: 2px 1px; }

  #toolList { display: flex; flex-direction: column; gap: 6px; }
  .toolParams { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
  .toolParams label { display: flex; align-items: center; gap: 5px;
                      font-size: 12px; color: var(--dim); }
  .toolParams input { width: 58px; background: var(--card); border: 1px solid var(--line);
                      color: var(--text); border-radius: 6px; padding: 4px 6px;
                      font-size: 12.5px; font-family: inherit; }
  .toolParams input:focus { outline: none; border-color: var(--accent); }
  .toolRow input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; flex: none; }
  .toolRow .desc { color: var(--dim); font-size: 12px; font-weight: 400; }

  #services { display: flex; flex-wrap: wrap; gap: 6px; }
  #models { font-size: 12px; color: var(--dim); margin-top: 10px; word-break: break-all; line-height: 1.6; }

  @media (max-width: 820px) {
    main { flex-direction: column; overflow-y: auto; }
    #left { border-right: none; min-height: 55vh; }
    #right { max-width: none; }
  }
</style>
</head>
<body>
<header>
  <h1>🤖 Sparky</h1>
  <span id="robotChip" class="chip">robot: …</span>
  <span id="sessionChip" class="chip">session: …</span>
  <div id="headerRight">
    <button id="muteBtn" title="Toggle the robot's microphone">🎤 mic on</button>
    <div id="volWrap" title="Robot speaker volume">
      <span>🔊</span>
      <input id="volume" type="range" min="0" max="120" step="5">
      <span id="volLabel" class="chip">…</span>
    </div>
    <button id="estopBtn" title="Emergency stop: halt motion, release motors, mute">■ STOP</button>
  </div>
</header>
<div id="muteBanner" title="Click to unmute">🔇 MIC MUTED — the robot cannot hear you. Click here to unmute.</div>
<main>
  <div id="left">
    <div id="transcript"></div>
    <div id="inputs">
      <div class="row">
        <input id="chatText" type="text" placeholder="Type to Sparky (goes through the assistant)…">
        <button class="primary" onclick="sendChat()">Send</button>
      </div>
      <div class="row">
        <input id="speakText" type="text" placeholder="Speak verbatim (no LLM)…">
        <button onclick="sendSpeak()">Speak</button>
      </div>
    </div>
  </div>
  <div id="right">
    <details class="sec" id="sec-camera" open>
      <summary>Camera</summary>
      <div class="secBody">
        <img id="camFeed" alt="camera feed">
        <select id="camRes"></select>
      </div>
    </details>
    <details class="sec" id="sec-look" open>
      <summary>Look</summary>
      <div class="secBody">
        <div id="dpad">
          <span class="blank"></span><button onclick="look('up')">▲</button><span class="blank"></span>
          <button onclick="look('left')">◀</button><button onclick="look('front')">●</button><button onclick="look('right')">▶</button>
          <span class="blank"></span><button onclick="look('down')">▼</button><span class="blank"></span>
        </div>
      </div>
    </details>
    <details class="sec" id="sec-anims">
      <summary>Animations</summary>
      <div class="secBody">
        <input id="animFilter" type="text" placeholder="Filter 117 animations…">
        <div id="anims"></div>
      </div>
    </details>
    <details class="sec" id="sec-speakers">
      <summary>Speakers</summary>
      <div class="secBody"><div id="speakerList"></div></div>
    </details>
    <details class="sec" id="sec-voice">
      <summary>Voice</summary>
      <div class="secBody"><select id="voiceSel"></select></div>
    </details>
    <details class="sec" id="sec-tools">
      <summary>Tools &amp; features</summary>
      <div class="secBody"><div id="toolList"></div></div>
    </details>
    <details class="sec" id="sec-services">
      <summary>Services</summary>
      <div class="secBody">
        <div id="services"></div>
        <div id="models"></div>
      </div>
    </details>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let muted = false;

/* ---------- transcript ---------- */
function addMsg(item) {
  const div = document.createElement('div');
  div.className = 'msg ' + (item.role === 'user' ? 'user' : 'assistant');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = item.role === 'user' ? (item.speaker || 'you') : 'sparky';
  if (item.role === 'user' && item.speaker) {
    who.style.cursor = 'pointer';
    who.title = 'Click to name this speaker';
    who.onclick = () => renameSpeaker(item.speaker);
  }
  div.appendChild(who);
  div.appendChild(document.createTextNode(item.text));
  const t = $('transcript');
  t.appendChild(div);
  t.scrollTop = t.scrollHeight;
}

async function renameSpeaker(label) {
  const name = prompt('Name for ' + label + ' (empty to forget):');
  if (name === null) return;
  await post('/speakers', {speaker: label, name: name.trim()});
  refreshStatus();
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(proto + '//' + location.host + location.pathname.replace(/\/$/, '') + '/ws');
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'history') { $('transcript').innerHTML = ''; m.items.forEach(addMsg); }
    else if (m.type === 'transcript') addMsg(m.item);
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}

async function post(path, body) {
  const r = await fetch(path.replace(/^\//, ''), { method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  return r.json();
}

function sendChat() {
  const v = $('chatText').value.trim();
  if (!v) return;
  post('/say', {text: v});
  $('chatText').value = '';
}
function sendSpeak() {
  const v = $('speakText').value.trim();
  if (!v) return;
  post('/speak', {text: v});
  $('speakText').value = '';
}
function look(direction) { post('/robot/look_at', {direction}); }
function play(name) { post('/robot/play_animation', {name}); }

$('chatText').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
$('speakText').addEventListener('keydown', e => { if (e.key === 'Enter') sendSpeak(); });

/* ---------- mute (server-authoritative; see the silent-deafness incident) ---------- */
function setMuted(m) {
  muted = !!m;
  $('muteBtn').textContent = muted ? '🔇 mic off' : '🎤 mic on';
  $('muteBtn').classList.toggle('muted', muted);
  $('muteBanner').style.display = muted ? 'block' : 'none';
}
async function setMute(target) {
  const r = await post('/mute', {muted: target});
  if (r && r.ok) setMuted(r.muted);
}
$('estopBtn').onclick = async () => {
  $('estopBtn').blur();  // drop focus so Space/Enter can't re-trigger it
  if (!confirm('Emergency stop: halt all motion and release the motors?')) return;
  await post('/estop', {});
  $('estopBtn').textContent = '■ STOPPED';
  setMuted(true);
};
$('muteBtn').onclick = () => {
  $('muteBtn').blur();  // focused buttons re-click on Space/Enter
  setMute(!muted);
};
$('muteBanner').onclick = () => setMute(false);

/* ---------- volume (top bar; only shown when the backend supports it) ---------- */
let volTimer = null;
$('volume').addEventListener('input', e => {
  $('volLabel').textContent = e.target.value + '%';
  clearTimeout(volTimer);
  volTimer = setTimeout(() => post('/volume', {percent: parseInt(e.target.value)}), 250);
});
async function loadVolume() {
  try {
    const v = await fetch('volume').then(r => r.json());
    if (v.ok && v.percent !== null) {
      $('volWrap').classList.add('show');
      $('volume').value = v.percent;
      $('volLabel').textContent = v.percent + '%';
    }
  } catch (e) {}
}

/* ---------- collapsible sections (state persisted) ---------- */
function initSections() {
  document.querySelectorAll('details.sec').forEach(d => {
    const saved = localStorage.getItem('sec:' + d.id);
    if (saved !== null) d.open = saved === '1';
    d.addEventListener('toggle', () => {
      localStorage.setItem('sec:' + d.id, d.open ? '1' : '0');
      if (d.id === 'sec-camera') syncCameraStream();
    });
  });
}

/* ---------- camera: live feed + resolution ---------- */
function syncCameraStream() {
  const img = $('camFeed');
  const want = $('sec-camera').open && !document.hidden;
  const streaming = !!img.getAttribute('src');
  if (want && !streaming) img.src = 'camera/stream?t=' + Date.now();
  else if (!want && streaming) img.removeAttribute('src');
}

let camResLoaded = false;
function syncCamera(cam) {
  if (!cam || !cam.options || !cam.options.length) return;
  const sel = $('camRes');
  if (!camResLoaded) {
    sel.innerHTML = '';
    cam.options.forEach(r => {
      const o = document.createElement('option');
      o.value = r; o.textContent = r.replace('x', ' × ');
      sel.appendChild(o);
    });
    sel.onchange = () => post('/camera', {resolution: sel.value});
    camResLoaded = true;
  }
  if (document.activeElement !== sel) sel.value = cam.resolution;
}

/* ---------- TTS voice section ---------- */
// group 67 Kokoro voices by prefix so the dropdown stays navigable
const VOICE_GROUPS = [
  ['af_', 'American female'], ['am_', 'American male'],
  ['bf_', 'British female'],  ['bm_', 'British male'],
];
function voiceGroupLabel(id) {
  const g = VOICE_GROUPS.find(([p]) => id.startsWith(p));
  return g ? g[1] : 'Other languages';
}
let voiceLoaded = false;
function syncVoice(v) {
  if (!v || !v.options || !v.options.length) return;
  const sel = $('voiceSel');
  if (!voiceLoaded) {
    sel.innerHTML = '';
    const order = ['American female', 'American male', 'British female',
                   'British male', 'Other languages'];
    const groups = {};
    v.options.forEach(id => (groups[voiceGroupLabel(id)] ||= []).push(id));
    order.filter(g => groups[g]).forEach(g => {
      const og = document.createElement('optgroup');
      og.label = g;
      groups[g].forEach(id => {
        const o = document.createElement('option');
        o.value = id; o.textContent = id;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    sel.onchange = () => post('/voice', {voice: sel.value});
    voiceLoaded = true;
  }
  if (document.activeElement !== sel) sel.value = v.voice;
}

/* ---------- speakers section ---------- */
function syncSpeakers(speakers) {
  const list = $('speakerList');
  list.innerHTML = '';
  const entries = Object.entries(speakers || {});
  if (!entries.length) {
    const d = document.createElement('div');
    d.className = 'spkEmpty';
    d.textContent = 'No named speakers yet — click a name on a transcript line, or people can just introduce themselves.';
    list.appendChild(d);
    return;
  }
  entries.forEach(([num, name]) => {
    const row = document.createElement('div');
    row.className = 'spkRow';
    const label = document.createElement('span');
    label.innerHTML = '<span class="name"></span> <span style="color:var(--dim)">· Speaker ' + num + '</span>';
    label.querySelector('.name').textContent = name;
    const btn = document.createElement('button');
    btn.textContent = 'rename';
    btn.onclick = () => renameSpeaker('Speaker ' + num);
    row.appendChild(label);
    row.appendChild(btn);
    list.appendChild(row);
  });
}

/* ---------- optional tools (agent capabilities, toggled server-side) ---------- */
function syncTools(tools) {
  const list = $('toolList');
  if (document.activeElement && list.contains(document.activeElement)) return;
  list.innerHTML = '';
  const entries = Object.entries(tools || {});
  if (!entries.length) {
    const d = document.createElement('div');
    d.className = 'spkEmpty';
    d.textContent = 'No optional tools available.';
    list.appendChild(d);
    return;
  }
  entries.forEach(([name, t]) => {
    const row = document.createElement('div');
    row.className = 'spkRow toolRow';
    const label = document.createElement('span');
    label.innerHTML = '<span class="name"></span><br><span class="desc"></span>';
    label.querySelector('.name').textContent = t.label || name;
    label.querySelector('.desc').textContent = t.description || '';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!t.enabled;
    cb.title = 'Takes effect within seconds — no restart needed';
    cb.onchange = async () => {
      const r = await post('/tools', {name, enabled: cb.checked});
      if (r.tools) syncTools(r.tools); else cb.checked = !cb.checked;
    };
    row.appendChild(label);
    row.appendChild(cb);
    list.appendChild(row);
    if (t.params && Object.keys(t.params).length) {
      const pRow = document.createElement('div');
      pRow.className = 'toolParams';
      let pTimer = null;
      Object.entries(t.params).forEach(([key, p]) => {
        const lab = document.createElement('label');
        lab.textContent = p.label + (p.unit ? ` (${p.unit})` : '');
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.min = p.min; inp.max = p.max; inp.value = p.value;
        inp.oninput = () => {
          clearTimeout(pTimer);
          pTimer = setTimeout(async () => {
            const params = {};
            pRow.querySelectorAll('input').forEach((el, i) =>
              params[Object.keys(t.params)[i]] = parseFloat(el.value) || 0);
            const r = await post('/tools', {name, enabled: cb.checked, params});
            if (r.tools) syncTools(r.tools);
          }, 600);
        };
        lab.appendChild(inp);
        pRow.appendChild(lab);
      });
      list.appendChild(pRow);
    }
  });
}

/* ---------- animations (grouped browser with filter) ---------- */
let animCatalog = [];
const ANIM_GROUPS = [
  ['classics', 'Gestures & states'],
  ['emotions', 'Emotions'],
  ['dances', 'Dances'],
];
function renderAnimations() {
  const q = $('animFilter').value.trim().toLowerCase();
  const root = $('anims');
  root.innerHTML = '';
  ANIM_GROUPS.forEach(([cat, label]) => {
    const items = animCatalog.filter(a => a.category === cat &&
      (!q || a.name.toLowerCase().includes(q) ||
       (a.description || '').toLowerCase().includes(q)));
    if (!items.length) return;
    // every category is its own collapsible with the count always visible;
    // no inner scroll caps (invisible nested scrollbars hid whole groups)
    const group = document.createElement('details');
    group.className = 'animCat';
    // filtering opens everything; otherwise remember the user's choice
    // (first visit: only the small classics group starts open, so all
    // three category headers are on screen at once)
    const saved = localStorage.getItem('animcat:' + cat);
    group.open = q ? true : (saved !== null ? saved === '1' : cat === 'classics');
    group.addEventListener('toggle', () => {
      if (!$('animFilter').value.trim())
        localStorage.setItem('animcat:' + cat, group.open ? '1' : '0');
    });
    const h = document.createElement('summary');
    h.textContent = `${label} (${items.length})`;
    const grid = document.createElement('div');
    grid.className = 'animGrid';
    items.forEach(a => {
      const b = document.createElement('button');
      b.textContent = a.name;
      b.title = (a.description ? a.description + ' — ' : '') + a.duration + 's';
      b.onclick = () => play(a.name);
      grid.appendChild(b);
    });
    group.appendChild(h);
    group.appendChild(grid);
    root.appendChild(group);
  });
  if (!root.children.length) {
    const d = document.createElement('div');
    d.className = 'spkEmpty';
    d.textContent = 'No animations match the filter.';
    root.appendChild(d);
  }
}
async function loadAnimations() {
  const r = await fetch('robot/animations').then(r => r.json());
  animCatalog = r.catalog ||
    (r.animations || []).map(n => ({name: n, category: 'classics',
                                    description: '', duration: 0}));
  $('animFilter').placeholder = `Filter ${animCatalog.length} animations…`;
  renderAnimations();
}
$('animFilter').addEventListener('input', renderAnimations);

/* ---------- status ---------- */
async function refreshStatus() {
  try {
    const s = await fetch('status').then(r => r.json());
    $('robotChip').textContent = 'robot: ' + (s.robot_connected ? 'connected' : 'offline');
    $('robotChip').className = 'chip ' + (s.robot_connected ? 'ok' : 'bad');
    $('sessionChip').textContent = 'session: ' + (s.session_active ? 'live' : 'starting');
    $('sessionChip').className = 'chip ' + (s.session_active ? 'ok' : 'bad');
    const sv = $('services'); sv.innerHTML = '';
    Object.entries(s.services || {}).forEach(([name, ok]) => {
      const c = document.createElement('span');
      c.className = 'chip ' + (ok ? 'ok' : 'bad');
      c.textContent = name;
      sv.appendChild(c);
    });
    if (s.audio && s.audio.mic_frame_age_secs !== undefined) {
      const micOk = s.audio.mic_frame_age_secs < 3;
      const c = document.createElement('span');
      c.className = 'chip ' + (micOk ? 'ok' : 'bad');
      c.textContent = micOk ? 'mic-flow' : 'mic-stalled ' + s.audio.mic_frame_age_secs + 's';
      c.title = 'reopens: mic ' + s.audio.mic_reopens + ', out ' + s.audio.out_reopens +
                ', write errors ' + s.audio.out_write_errors +
                ', helper overflows ' + (s.audio.mic_helper_overflows ?? '–');
      sv.appendChild(c);
    }
    $('models').textContent = 'agent: ' + s.models.agent + ' · router: ' + s.models.router;
    syncCamera(s.camera);
    syncVoice(s.voice);
    syncSpeakers(s.speakers);
    syncTools(s.tools);
    if (s.muted !== muted) setMuted(s.muted);
  } catch (e) { /* panel keeps trying */ }
}

connectWS();
initSections();
loadAnimations();
loadVolume();
refreshStatus();
syncCameraStream();
setInterval(refreshStatus, 10000);
// stale tabs are how the mute state went missing — resync on focus;
// also pause/resume the camera stream with tab visibility
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshStatus();
  syncCameraStream();
});
</script>
