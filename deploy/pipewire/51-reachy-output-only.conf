# Pin the Reachy Mini card to output-only in PipeWire, durably.
# (Runtime `pactl set-card-profile` is reverted by WirePlumber on restarts,
# which silently puts the bot's mic back on the stall-prone PipeWire capture
# path.) The bot captures the mic directly from hardware.
# Install as ~/.config/wireplumber/wireplumber.conf.d/51-reachy-output-only.conf
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Pollen_Robotics_Reachy_Mini_Audio.*" }
    ]
    actions = {
      update-props = {
        device.profile = "output:analog-stereo"
        device.profile.pending = "output:analog-stereo"
      }
    }
  }
]
