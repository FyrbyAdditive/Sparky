# Sparky inference stack — DGX Spark B (dual-Spark "split" profile)
#
# Runs everything except the big text model (which occupies Spark A):
#   vllm-vision  :8020  vision LLM
#   vllm-router  :8030  intent router
#   riva-stt     :50051 Parakeet NIM (streaming ASR)
#   kokoro-tts   :8880  Kokoro TTS
#   wiki-offline :8040  offline Wikipedia
#
# Bring up with: docker compose --env-file ../profiles/quality-2spark-split.env up -d
# (COMPOSE_PROFILES in that env file selects Spark A services; this file has none.)

services:
  # NIM containers run as non-root and cannot write a fresh named volume
  # (manifest download fails with "Permission denied"); open it up first.
  init-volumes:
    image: busybox:latest
    container_name: init-volumes
    command: sh -c "chmod -R 777 /nim && echo volumes ready"
    volumes:
      - nim-cache:/nim
    restart: "no"

  vllm-vision:
    restart: unless-stopped
    container_name: vllm-vision
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.05-py3}
    ipc: host
    command: >
      vllm serve ${VISION_MODEL:-nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-FP8}
      --host 0.0.0.0 --port 8000
      --trust-remote-code
      --mamba_ssm_cache_dtype float32
      --max-model-len ${VISION_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VISION_GPU_FRACTION:-0.30}
      --limit-mm-per-prompt '{"image": 2}'
      ${VISION_EXTRA_ARGS:-}
    ports:
      - "8020:8000"
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      start_period: 2h
      start_interval: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  vllm-router:
    restart: unless-stopped
    container_name: vllm-router
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.05-py3}
    ipc: host
    command: >
      vllm serve ${ROUTER_MODEL:-microsoft/Phi-3-mini-128k-instruct}
      --host 0.0.0.0 --port 8000
      --trust-remote-code
      --max-model-len ${ROUTER_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${ROUTER_GPU_FRACTION:-0.10}
      ${ROUTER_EXTRA_ARGS:-}
    ports:
      - "8030:8000"
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      start_period: 2h
      start_interval: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  riva-stt:
    restart: unless-stopped
    container_name: riva-stt
    image: nvcr.io/nim/nvidia/parakeet-1-1b-ctc-en-us:1.4.0
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    environment:
      - NIM_MODEL_PROFILE=e48ada80aead95c5fdcccc3b302d07d406d1d0b25858e4994f3cc34338002572
      - NGC_API_KEY=${NGC_API_KEY:?NGC key needed once to pull/initialize the Riva NIM}
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
    ports:
      - "50051:50051"
      - "9000:9000"
    volumes:
      - nim-cache:/opt/nim/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/v1/health/ready"]
      start_period: 2h
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  kokoro-tts:
    restart: unless-stopped
    container_name: kokoro-tts
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:latest}
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8880/health || curl -f http://127.0.0.1:8880/v1/models"]
      start_period: 30m
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  wiki-offline:
    restart: unless-stopped
    container_name: wiki-offline
    build:
      context: ../wiki-offline
    ports:
      - "8040:8040"
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WIKI_INDEX=${WIKI_INDEX:-neuml/txtai-wikipedia}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8040/health"]
      start_period: 2h
      start_interval: 10s

volumes:
  hf-cache:
  nim-cache:
