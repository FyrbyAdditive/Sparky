# Sparky two-Spark stack — one compose, host-selected via COMPOSE_PROFILES
# (see ../profiles/magi.env and ../profiles/shodan.env):
#   magi   = init-volumes, nemotron-asr, kokoro-tts, tls-proxy
#            (audio host + the robot's home)
#   shodan = vllm-agent (Qwen3.6-35B multimodal: agent/chitchat/vision AND
#            intent routing — prefix caching makes the constant router
#            prompt nearly free), wiki-offline (full Wikipedia index)
# Project name pinned so volumes/containers are stable across checkouts.
name: sparky

services:
  # NIM containers run as non-root and cannot write a fresh named volume
  # (manifest download fails with "Permission denied"); open it up first.
  # Same pattern as NVIDIA spark-reachy-photo-booth.
  init-volumes:
    image: busybox:latest
    container_name: init-volumes
    profiles: [ "magi" ]
    command: sh -c "chmod -R 777 /nim && echo volumes ready"
    volumes:
      - nim-cache:/nim
    restart: "no"

  vllm-agent:
    restart: unless-stopped
    profiles: [ "shodan" ]
    container_name: vllm-agent
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.05-py3}
    ipc: host
    command: >
      vllm serve ${AGENT_MODEL:-RedHatAI/Qwen3.6-35B-A3B-NVFP4}
      --host 0.0.0.0 --port 8000
      --trust-remote-code
      --max-model-len ${AGENT_MAX_MODEL_LEN:-49152}
      --gpu-memory-utilization ${AGENT_GPU_FRACTION:-0.50}
      ${AGENT_EXTRA_ARGS:-}
    ports:
      - "8010:8000"
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_MARLIN_USE_ATOMIC_ADD=${VLLM_MARLIN_USE_ATOMIC_ADD:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      start_period: 2h
      start_interval: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  kokoro-tts:
    restart: unless-stopped
    profiles: [ "magi" ]
    container_name: kokoro-tts
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:latest}
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8880/health || curl -f http://127.0.0.1:8880/v1/models"]
      start_period: 30m
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # Streaming ASR: Nemotron 3.5 (0.6b, cache-aware RNN-T) NIM.
  nemotron-asr:
    restart: unless-stopped
    profiles: [ "magi" ]
    container_name: nemotron-asr
    image: nvcr.io/nim/nvidia/nemotron-asr-streaming:1.2.0
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    environment:
      - NGC_API_KEY=${NGC_API_KEY:?NGC key needed to initialize the NIM}
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
    ports:
      - "50051:50051"
      - "9000:9000"
    volumes:
      - nim-cache:/opt/nim/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/v1/health/ready"]
      start_period: 2h
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  wiki-offline:
    restart: unless-stopped
    profiles: [ "shodan" ]
    container_name: wiki-offline
    # hard cap: the full index + torch must never compound an engine spike
    mem_limit: 16g
    build:
      context: ../wiki-offline
    ports:
      - "8040:8040"
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WIKI_INDEX=${WIKI_INDEX:-neuml/txtai-wikipedia}
    healthcheck:
      # python:3.12-slim has no curl — probe with the stdlib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/health', timeout=3)"]
      start_period: 2h
      start_interval: 10s

  # HTTPS front for the bot UI (mic/camera need a secure context off-localhost).
  # Put per-machine certs in ../tls/certs (magi.crt/magi.key — gitignored).
  tls-proxy:
    restart: unless-stopped
    profiles: [ "magi" ]
    container_name: tls-proxy
    image: nginx:alpine
    network_mode: host
    volumes:
      - ../tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../tls/certs:/etc/nginx/certs:ro
    healthcheck:
      # measure nginx itself, not the bot behind it: the panel upstream
      # legitimately 502s whenever the robot roams to another host
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      start_period: 1m
      start_interval: 5s

volumes:
  hf-cache:
  nim-cache:
