# Sparky consolidated stack — one compose for every host, role-selected
# via COMPOSE_PROFILES (see ../profiles/*.env):
#   audio  = init-volumes, riva-stt, kokoro-tts, tls-proxy   (the robot/bot host)
#   llm    = vllm-agent, vllm-router                          (inference host)
#   vision = vllm-vision                                      (parity profile only)
#   wiki   = wiki-offline
# Single-Spark setups just enable several roles on one machine.
# Project name pinned so volumes/containers are stable across checkouts.
name: sparky

services:
  # NIM containers run as non-root and cannot write a fresh named volume
  # (manifest download fails with "Permission denied"); open it up first.
  # Same pattern as NVIDIA spark-reachy-photo-booth.
  init-volumes:
    image: busybox:latest
    container_name: init-volumes
    profiles: [ "audio" ]
    command: sh -c "chmod -R 777 /nim && echo volumes ready"
    volumes:
      - nim-cache:/nim
    restart: "no"

  vllm-agent:
    restart: unless-stopped
    profiles: [ "llm" ]
    container_name: vllm-agent
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.05-py3}
    ipc: host
    command: >
      vllm serve ${AGENT_MODEL:-nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8}
      --host 0.0.0.0 --port 8000
      --trust-remote-code
      --mamba_ssm_cache_dtype float32
      --max-model-len ${AGENT_MAX_MODEL_LEN:-32768}
      --gpu-memory-utilization ${AGENT_GPU_FRACTION:-0.40}
      ${AGENT_EXTRA_ARGS:-}
    ports:
      - "8010:8000"
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_MARLIN_USE_ATOMIC_ADD=${VLLM_MARLIN_USE_ATOMIC_ADD:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      start_period: 2h
      start_interval: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  vllm-vision:
    restart: unless-stopped
    profiles: [ "vision" ]
    container_name: vllm-vision
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.05-py3}
    ipc: host
    command: >
      vllm serve ${VISION_MODEL:-nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-FP8}
      --host 0.0.0.0 --port 8000
      --trust-remote-code
      --mamba_ssm_cache_dtype float32
      --max-model-len ${VISION_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VISION_GPU_FRACTION:-0.20}
      --limit-mm-per-prompt '{"image": 2}'
      ${VISION_EXTRA_ARGS:-}
    ports:
      - "8020:8000"
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      start_period: 2h
      start_interval: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  vllm-router:
    restart: unless-stopped
    profiles: [ "llm" ]
    container_name: vllm-router
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.05-py3}
    ipc: host
    command: >
      vllm serve ${ROUTER_MODEL:-microsoft/Phi-3-mini-128k-instruct}
      --host 0.0.0.0 --port 8000
      --trust-remote-code
      --max-model-len ${ROUTER_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${ROUTER_GPU_FRACTION:-0.14}
      ${ROUTER_EXTRA_ARGS:-}
    ports:
      - "8030:8000"
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      start_period: 2h
      start_interval: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  riva-stt:
    restart: unless-stopped
    profiles: [ "audio" ]
    container_name: riva-stt
    image: nvcr.io/nim/nvidia/parakeet-1-1b-ctc-en-us:1.4.0
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    environment:
      - NIM_MODEL_PROFILE=e48ada80aead95c5fdcccc3b302d07d406d1d0b25858e4994f3cc34338002572
      - NGC_API_KEY=${NGC_API_KEY:?NGC key needed once to pull/initialize the Riva NIM}
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
    ports:
      - "50051:50051"
      - "9000:9000"
    volumes:
      - nim-cache:/opt/nim/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/v1/health/ready"]
      start_period: 2h
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  kokoro-tts:
    restart: unless-stopped
    profiles: [ "audio" ]
    container_name: kokoro-tts
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:latest}
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8880/health || curl -f http://127.0.0.1:8880/v1/models"]
      start_period: 30m
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # Nemotron 3.5 streaming ASR (0.6b) — alternative STT for A/B against
  # Parakeet. Not part of the "audio" profile; bring it up by name:
  #   cd deploy/stack && docker compose --env-file envfile-merged up -d nemotron-asr
  # Bot-side switch: RIVA_SERVER=<host>:50052 (Parakeet stays on :50051).
  nemotron-asr:
    restart: unless-stopped
    profiles: [ "audio-alt" ]
    container_name: nemotron-asr
    image: nvcr.io/nim/nvidia/nemotron-asr-streaming:1.2.0
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    environment:
      - NGC_API_KEY=${NGC_API_KEY:?NGC key needed to initialize the NIM}
      - NIM_HTTP_API_PORT=9000
      - NIM_GRPC_API_PORT=50051
    ports:
      - "50052:50051"
      - "9001:9000"
    volumes:
      - nim-cache:/opt/nim/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/v1/health/ready"]
      start_period: 2h
      start_interval: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  wiki-offline:
    restart: unless-stopped
    profiles: [ "wiki" ]
    container_name: wiki-offline
    # hard cap: the full index + torch must never compound an engine spike
    mem_limit: 16g
    build:
      context: ../wiki-offline
    ports:
      - "8040:8040"
    volumes:
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WIKI_INDEX=${WIKI_INDEX:-neuml/txtai-wikipedia}
    healthcheck:
      # python:3.12-slim has no curl — probe with the stdlib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/health', timeout=3)"]
      start_period: 2h
      start_interval: 10s

  # HTTPS front for the bot UI (mic/camera need a secure context off-localhost).
  # Put per-machine certs in ../tls/certs (magi.crt/magi.key — gitignored).
  tls-proxy:
    restart: unless-stopped
    profiles: [ "audio" ]
    container_name: tls-proxy
    image: nginx:alpine
    network_mode: host
    volumes:
      - ../tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../tls/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:443/ || exit 1"]
      start_period: 1m
      start_interval: 5s

volumes:
  hf-cache:
  nim-cache:
