# TLS front for the Sparky control panel. Browsers require a secure context
# off-localhost, so the panel is served HTTPS and proxied to the bot's API
# on 127.0.0.1:7861 (panel page, /say /speak /status, WS /ws transcript).
# Certs live in deploy/tls/certs/ (gitignored — ship them per machine).

events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # keep-alive pool to uvicorn so panel polls don't redo TCP per request
  upstream bot_panel {
    server 127.0.0.1:7861;
    keepalive 16;
  }

  gzip on;
  gzip_types application/json application/javascript text/css;

  server {
    listen 443 ssl;
    http2 on;
    server_name magi magi.fyrby.internal;

    ssl_certificate     /etc/nginx/certs/magi.crt;
    ssl_certificate_key /etc/nginx/certs/magi.key;

    # live transcript WebSocket: upgrade headers, no buffering
    location = /ws {
      proxy_pass http://bot_panel;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://bot_panel;
      proxy_http_version 1.1;
      # empty Connection reuses upstream keep-alive (never on the WS path)
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
