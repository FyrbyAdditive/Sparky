# TLS front for the bot web UI. Browsers require a secure context for
# mic/camera on non-localhost hosts, so the WebRTC UI must be served HTTPS.
# Certs live in deploy/tls/certs/ (gitignored — ship them per machine).
# Signaling (POST /api/offer, websockets) proxies to the bot; WebRTC media
# flows peer-to-peer over UDP and never touches this proxy.

events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name magi magi.fyrby.internal;

    ssl_certificate     /etc/nginx/certs/magi.crt;
    ssl_certificate_key /etc/nginx/certs/magi.key;

    location / {
      proxy_pass http://127.0.0.1:7861;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
