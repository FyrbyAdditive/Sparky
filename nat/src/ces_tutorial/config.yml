general:
  front_end:
    _type: fastapi


functions:
   wikipedia_search:
      _type: wiki_search_offline
      base_url: ${WIKI_BASE_URL:-http://localhost:8040}
      max_results: 2

   router:
      _type: router
      route_config:
        - name: other
          description: Any question that requires careful thought, outside information, image understanding, or tool calling to take actions.
        - name: chit_chat
          description: Any simple chit chat, small talk, or casual conversation.
        - name: image_understanding
          description: A question that requires the assistant to see the user eg a question about their appearance, environment, scene or surroundings. Examples what am I holding, what am I wearing, what do I look like, what is in my surroundings, what does it say on the whiteboard. Questions about attire eg what color is my shirt/hat/jacket/etc


      llm_name: routing_llm

   react_agent:
      _type: react_agent
      llm_name: agent_llm
      verbose: true
      parse_agent_response_max_retries: 3
      tool_names: [wikipedia_search]

# All LLMs are served locally (vLLM/llama.cpp on the Spark(s)); endpoints and
# model names come from the environment so model profiles can swap them
# without code changes. api_key is unused by local servers but the OpenAI
# client requires a non-empty string.
llms:
   agent_llm:
      _type: openai
      api_key: "EMPTY"
      base_url: ${AGENT_LLM_BASE_URL:-http://localhost:8010/v1}
      model_name: ${AGENT_LLM_MODEL:-nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8}
      temperature: 0.0
      # ReAct traces need room; small defaults truncate and break parsing
      max_tokens: 2048
   chitchat_llm:
      _type: openai
      api_key: "EMPTY"
      base_url: ${CHITCHAT_LLM_BASE_URL:-http://localhost:8010/v1}
      model_name: ${CHITCHAT_LLM_MODEL:-nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8}
      temperature: 0.0
      max_tokens: 512
   routing_llm:
      _type: openai
      api_key: "EMPTY"
      base_url: ${ROUTER_LLM_BASE_URL:-http://localhost:8030/v1}
      model_name: ${ROUTER_LLM_MODEL:-microsoft/Phi-3-mini-128k-instruct}
      temperature: 0.0
      max_tokens: 128
   image_llm:
      _type: openai
      api_key: "EMPTY"
      base_url: ${VISION_LLM_BASE_URL:-http://localhost:8020/v1}
      model_name: ${VISION_LLM_MODEL:-nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-FP8}
      temperature: 0.0
      max_tokens: 1024

workflow:
   _type: ces_tutorial_router_agent
   agent: react_agent
   router: router
   chitchat_llm: chitchat_llm
   image_llm: image_llm
