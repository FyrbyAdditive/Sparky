general:
  front_end:
    _type: fastapi
    # The voice client only consumes the chat chunks; without this, every
    # agent turn also serializes+streams full workflow introspection payloads
    # (prompt echoes, tool I/O) as intermediate_data: SSE events it discards.
    # (quoted "off" — bare off is YAML boolean false)
    step_adaptor:
      mode: "off"


functions:
   wikipedia_search:
      _type: wiki_search_offline
      base_url: ${WIKI_BASE_URL:-http://localhost:8040}
      robot_api_base_url: ${ROBOT_API_BASE_URL:-http://localhost:7861}
      max_results: 2

   play_animation:
      _type: robot_play_animation
      base_url: ${ROBOT_API_BASE_URL:-http://localhost:7861}

   look_at:
      _type: robot_look_at
      base_url: ${ROBOT_API_BASE_URL:-http://localhost:7861}

   remember_speaker_name:
      _type: robot_remember_speaker_name
      base_url: ${ROBOT_API_BASE_URL:-http://localhost:7861}

   # optional tools: gated at call time by the robot API's registry
   # (panel > Tools); disabled/unreachable -> polite refusal, never online
   web_search:
      _type: web_search_duckduckgo
      searxng_url: ${SEARXNG_URL:-http://magi:8888}
      robot_api_base_url: ${ROBOT_API_BASE_URL:-http://localhost:7861}
      max_results: 5

   read_web_page:
      _type: web_read_page
      robot_api_base_url: ${ROBOT_API_BASE_URL:-http://localhost:7861}
      max_chars: 6000

   router:
      _type: router
      route_config:
        - name: other
          description: Any question that requires careful thought, outside information, image understanding, or tool calling to take actions. Includes ANY request involving a physical action or gesture, even mixed with a question or other request, eg nod, dance, wiggle your antennas, look left/right/up/down, look around, wake up, go to sleep, nod while answering. Also includes when someone tells the robot their name, introduces themselves or another person, or asks the robot to remember or forget who a speaker is. Also includes questions about current events, news, weather, sports scores, prices, or anything needing an internet search or reading a web page.
        - name: chit_chat
          description: Any simple chit chat, small talk, or casual conversation.
        - name: image_understanding
          description: A question that requires the assistant to see the user eg a question about their appearance, environment, scene or surroundings. Examples what am I holding, what am I wearing, what do I look like, what is in my surroundings, what does it say on the whiteboard. Questions about attire eg what color is my shirt/hat/jacket/etc


      llm_name: routing_llm

   react_agent:
      _type: react_agent
      llm_name: agent_llm
      verbose: true
      parse_agent_response_max_retries: 3
      tool_names: [wikipedia_search, play_animation, look_at, remember_speaker_name, web_search, read_web_page]
      # Images are redacted on this route (a separate vision route sees them);
      # without this the model tells users it has no camera.
      additional_instructions: You are embodied in a robot that does have a camera; questions about what you can see are answered elsewhere, so never claim you lack a camera or a body. For factual or encyclopedic lookups prefer wikipedia_search (offline); use web_search only for current events, news, weather, prices, or anything needing the live internet, and read_web_page to open a promising result URL.

# All LLMs are served locally (vLLM/llama.cpp on the Spark(s)); endpoints and
# model names come from the environment so model profiles can swap them
# without code changes. api_key is unused by local servers but the OpenAI
# client requires a non-empty string.
llms:
   agent_llm:
      _type: openai
      api_key: "EMPTY"
      base_url: ${AGENT_LLM_BASE_URL:-http://localhost:8010/v1}
      model_name: ${AGENT_LLM_MODEL:-RedHatAI/Qwen3.6-35B-A3B-NVFP4}
      temperature: 0.6
      # ReAct traces need room; small defaults truncate and break parsing
      max_tokens: 2048
   chitchat_llm:
      _type: openai
      api_key: "EMPTY"
      base_url: ${CHITCHAT_LLM_BASE_URL:-http://localhost:8010/v1}
      model_name: ${CHITCHAT_LLM_MODEL:-RedHatAI/Qwen3.6-35B-A3B-NVFP4}
      # 0.0 made every reply near-identical; conversation needs variety
      temperature: 0.7
      max_tokens: 512
   routing_llm:
      _type: openai
      api_key: "EMPTY"
      base_url: ${ROUTER_LLM_BASE_URL:-http://localhost:8010/v1}
      model_name: ${ROUTER_LLM_MODEL:-RedHatAI/Qwen3.6-35B-A3B-NVFP4}
      temperature: 0.0
      max_tokens: 128
   image_llm:
      _type: openai
      api_key: "EMPTY"
      base_url: ${VISION_LLM_BASE_URL:-http://localhost:8010/v1}
      model_name: ${VISION_LLM_MODEL:-RedHatAI/Qwen3.6-35B-A3B-NVFP4}
      temperature: 0.4
      max_tokens: 1024

workflow:
   _type: ces_tutorial_router_agent
   agent: react_agent
   router: router
   chitchat_llm: chitchat_llm
   image_llm: image_llm
